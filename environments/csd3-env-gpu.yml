name: neutron-jax-cpu
channels: [conda-forge]
dependencies:
  - python=3.12
  - jax=0.9.0
  - jaxlib=0.9.0=*cuda*
  - blackjax=1.7.1
  - bilby=2.7.0
  - python-lalsimulation=6.2.0
  - gwosc=0.8.1
  - gwdatafind=2.1.0
  - dqsegdb2=1.3.0
  - ligotimegps=2.1.0
  - h5netcdf=1.7.3
  - numdifftools=0.9.42
  - dateparser=1.2.2
  - jupyter=1.1.1
  # pinned to Mac versions for numerical parity
  - numpy=2.3.4
  - scipy=1.18.0
  - ml_dtypes=0.5.4
  - pandas=2.3.3
  - astropy-base=7.1.1
  - hdf5=1.14.6
  - h5py=3.15.1
  - gsl=2.7
  - dynesty=3.0.0
  - bilby.cython=0.5.3
  # JAX ecosystem, pinned to Mac versions (moved from pip where available)
  - mpmath=1.3.0
  - sympy=1.14.0
  - equinox=0.13.8
  - jaxtyping=0.3.11
  - lineax=0.1.0
  - optimistix=0.1.0
  - diffrax=0.7.2
  - flax=0.12.6
  - orbax-checkpoint=0.12.7
  - pip
  - pip:
      - jimgw==0.5.2
      - flowmc==0.6.4
      - ripplegw==0.4.1
      - evosax==0.3.2
